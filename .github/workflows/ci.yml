name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "not gofmt-ed:"; echo "$unformatted"; exit 1
          fi
      - run: go vet ./...
      - run: go test -short -race ./...

  cross-build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goos: [linux, darwin]
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: build ${{ matrix.goos }}/${{ matrix.goarch }}
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          go build -trimpath ./...
          go vet ./...

  integration:
    # ubuntu-latest ships a running Docker Engine; the docker backend and the
    # MCP server are exercised against it for real
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: docker version
      - name: integration tests
        run: go test -race ./...
      - name: build
        run: make build
      - name: end to end
        working-directory: ${{ runner.temp }}
        run: |
          # an empty dir: default spec, no source shipped
          out=$("$GITHUB_WORKSPACE/bin/ephemeris" run -- sh -c 'echo hi')
          test "$out" = hi
          "$GITHUB_WORKSPACE/bin/ephemeris" ls
      - name: no sandboxes left behind
        if: always()
        run: |
          left=$(docker ps -aq --filter label=dev.ephemeris.managed=true)
          if [ -n "$left" ]; then docker ps -a --filter label=dev.ephemeris.managed=true; docker rm -f $left; exit 1; fi